name: Boards
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test

  sync:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'esphub-ai/esphub-boards' &&
      github.ref == 'refs/heads/main' &&
      vars.BOARDS_SYNC_ENABLED == 'true'
    concurrency:
      group: esphub-boards-production
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sync
        env:
          BOARDS_DATABASE_URL: ${{ secrets.BOARDS_DATABASE_URL }}
          FIRMWARE_R2_ENDPOINT: ${{ vars.FIRMWARE_R2_ENDPOINT }}
          FIRMWARE_R2_ACCESS_KEY_ID: ${{ secrets.FIRMWARE_R2_ACCESS_KEY_ID }}
          FIRMWARE_R2_SECRET_ACCESS_KEY: ${{ secrets.FIRMWARE_R2_SECRET_ACCESS_KEY }}
